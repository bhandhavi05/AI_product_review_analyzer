{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>AI Product Review Analyzer</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="{% static 'css/style.css' %}?v=red-black-6">

</head>

<body>

<nav class="navbar navbar-expand-lg">

<div class="container">

<a class="navbar-brand" href="/">
AI Review Analyzer
</a>

<div>

<a href="/" class="btn btn-outline-primary me-2">
Home
</a>

<a href="/products/" class="btn btn-outline-primary me-2">
Products
</a>

<a href="/compare/" class="btn btn-primary">
Compare
</a>

</div>

</div>

</nav>

{% if messages %}

<div class="container mt-3">

{% for message in messages %}

<div class="alert {% if message.tags == 'error' %}alert-danger{% else %}alert-{{ message.tags }}{% endif %}">
{{ message }}
</div>

{% endfor %}

</div>

{% endif %}
{% block content %}
{% endblock %}

<div class="footer">
© 2026 AI Product Review Analyzer
</div>

<script src="{% static 'js/script.js' %}"></script>

</body>
</html>
